<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">A counterexample can reveal an economic insight</title>
<desc id="desc">In a classic Cournot example with one incumbent and one entrant, profitable entry need not increase welfare. With a equals one, c equals zero, and entry cost one twelfth, entrant profit is one thirty-sixth but welfare falls by one seventy-second. Entry can divert sales and duplicate setup costs.</desc>
<!-- Modified for the original workflow refresh, 2026-09-14. Legacy filename retained; the quota funnel is retired. -->
<defs>
  <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16324f" flood-opacity="0.10"/></filter>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #102a43; }
    .subtitle { font-size: 23px; fill: #486581; }
    .heading { font-size: 25px; font-weight: 700; fill: #183b56; }
    .body { font-size: 22px; fill: #486581; }
    .note { font-size: 18px; fill: #52606d; }
    .card { stroke-width: 1.8; filter: url(#shadow); }
    .arrow { fill: none; stroke: #1f4e79; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1200" height="560" fill="#f7fafc"/>
<text x="48" y="69" class="title">A useful boundary can become the insight</text>
<text x="48" y="111" class="subtitle">One small example can change the question worth asking.</text>
<rect x="48" y="160" width="348" height="220" rx="20" class="card" fill="#fff4df" stroke="#d99a22"/>
<rect x="426" y="160" width="348" height="220" rx="20" class="card" fill="#e8f3ff" stroke="#5b8def"/>
<rect x="804" y="160" width="348" height="220" rx="20" class="card" fill="#eaf7f2" stroke="#63a38f"/>
<text x="74" y="207" class="heading">Initial conjecture</text>
<text x="74" y="255" class="body">Profitable entry</text>
<text x="74" y="287" class="body">always helps society.</text>
<text x="74" y="344" class="note">A claim to test</text>
<text x="452" y="207" class="heading">Test the model</text>
<text x="452" y="255" class="body">Entrant profit: +1/36</text>
<text x="452" y="287" class="body">Welfare change: -1/72</text>
<text x="452" y="344" class="note">The universal claim is false</text>
<text x="830" y="207" class="heading">Economic insight</text>
<text x="830" y="255" class="body">Entry can divert sales</text>
<text x="830" y="287" class="body">and duplicate setup costs.</text>
<text x="830" y="344" class="note">Private gain can exceed social gain</text>
<path class="arrow" d="M403 270 H419 M413 264 L419 270 L413 276"/>
<path class="arrow" d="M781 270 H797 M791 264 L797 270 L791 276"/>
<rect x="48" y="422" width="1104" height="95" rx="18" fill="#102a43"/>
<text x="76" y="458" font-size="22" font-weight="600" fill="#ffffff">Refute the false claim. Explain the condition that changes the answer.</text>
<text x="76" y="492" font-size="18" fill="#d9e2ec">Classic Cournot example: 1 to 2 firms, a = 1, c = 0, F = 1/12. Teaching only.</text>
</svg>
