<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">From an economic question to a clear theory paper</title>
<desc id="desc">Start with an idea, model, claim, or draft. Move between exploring mechanisms, testing models and evidence, and explaining the economic lesson. The researcher chooses or delegates the direction.</desc>
<!-- Modified for the original workflow refresh, 2026-09-14. Original palette and card style retained. -->
<defs>
  <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#16324f" flood-opacity="0.10"/></filter>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #102a43; }
    .subtitle { font-size: 23px; fill: #486581; }
    .heading { font-size: 32px; font-weight: 700; fill: #183b56; }
    .body { font-size: 19px; fill: #486581; }
    .card { stroke-width: 1.8; filter: url(#shadow); }
    .arrow { fill: none; stroke: #1f4e79; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1200" height="690" fill="#f7fafc"/>
<text x="48" y="70" class="title">From an economic question to a clear paper</text>
<text x="48" y="111" class="subtitle">Explore the idea. Test the mechanism. Explain what changes.</text>
<rect x="48" y="153" width="1104" height="72" rx="16" fill="#ffffff" stroke="#b8c7d9" stroke-width="1.5"/>
<circle cx="83" cy="189" r="9" fill="#63a38f"/>
<text x="108" y="197" font-size="24" fill="#183b56">Start anywhere: an idea, a model, a claim, or a draft.</text>
<rect x="48" y="272" width="348" height="239" rx="20" class="card" fill="#e8f3ff" stroke="#5b8def"/>
<rect x="426" y="272" width="348" height="239" rx="20" class="card" fill="#eaf7f2" stroke="#63a38f"/>
<rect x="804" y="272" width="348" height="239" rx="20" class="card" fill="#f2efff" stroke="#8f77c7"/>
<text x="74" y="328" class="heading">Explore</text>
<path d="M74 350 H123" stroke="#5b8def" stroke-width="4" stroke-linecap="round"/>
<text x="74" y="392" class="body">Find the economic tension</text>
<text x="74" y="428" class="body">Compare possible mechanisms</text>
<text x="74" y="464" class="body">Read the closest literature</text>
<text x="452" y="328" class="heading">Test</text>
<path d="M452 350 H501" stroke="#63a38f" stroke-width="4" stroke-linecap="round"/>
<text x="452" y="392" class="body">Build a small, useful model</text>
<text x="452" y="428" class="body">Check proofs and counterexamples</text>
<text x="452" y="464" class="body">Learn from the boundaries</text>
<text x="830" y="328" class="heading">Explain</text>
<path d="M830 350 H879" stroke="#8f77c7" stroke-width="4" stroke-linecap="round"/>
<text x="830" y="392" class="body">State the economic lesson</text>
<text x="830" y="428" class="body">Write for the intended reader</text>
<text x="830" y="464" class="body">Revise with fresh feedback</text>
<path class="arrow" d="M403 385 H419 M414 380 L419 385 L414 390 M419 399 H403 M408 394 L403 399 L408 404"/>
<path class="arrow" d="M781 385 H797 M792 380 L797 385 L792 390 M797 399 H781 M786 394 L781 399 L786 404"/>
<rect x="48" y="558" width="1104" height="89" rx="18" fill="#102a43"/>
<text x="76" y="594" font-size="25" font-weight="600" fill="#ffffff">A sharper question. A defensible result. A readable paper.</text>
<text x="76" y="626" font-size="19" fill="#d9e2ec">Move between activities as evidence changes. You choose or delegate the direction.</text>
</svg>
